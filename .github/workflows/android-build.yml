name: Build Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install stable Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and validate offline APK
        run: |
          chmod +x scripts/build-android-apk.sh
          scripts/build-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pure-DDZ-Classic-v1.2.0-ci
          retention-days: 14
          path: |
            dist/Pure-DDZ-Classic-v1.2.0.apk
            dist/Pure-DDZ-Classic-v1.2.0.sha256

  launch-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pure-DDZ-Classic-v1.2.0-ci
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Install and keep MainActivity alive on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -lc 'set -euo pipefail; adb install -r dist/Pure-DDZ-Classic-v1.2.0.apk; adb logcat -c; adb shell am force-stop com.pureddz.classic; adb shell am start -W -n com.pureddz.classic/.MainActivity | tee /tmp/am-start.txt; grep -q "Status: ok" /tmp/am-start.txt; sleep 5; PID="$(adb shell pidof com.pureddz.classic 2>/dev/null | tr -d "\r" || true)"; adb logcat -d -v time > /tmp/pure-ddz-logcat.txt || true; if [[ -z "$PID" ]]; then echo APP_PROCESS_DIED_AFTER_LAUNCH; grep -E -A 30 -B 15 "FATAL EXCEPTION|AndroidRuntime|Process: com\.pureddz\.classic|WebView|chromium" /tmp/pure-ddz-logcat.txt || tail -n 300 /tmp/pure-ddz-logcat.txt; exit 1; fi; adb shell dumpsys activity activities | grep -q "com.pureddz.classic/.MainActivity" || { echo MAIN_ACTIVITY_NOT_FOREGROUND; grep -E -A 30 -B 15 "FATAL EXCEPTION|AndroidRuntime|Process: com\.pureddz\.classic|WebView|chromium" /tmp/pure-ddz-logcat.txt || tail -n 300 /tmp/pure-ddz-logcat.txt; exit 1; }; if grep -E "FATAL EXCEPTION|AndroidRuntime.*com\.pureddz\.classic" /tmp/pure-ddz-logcat.txt; then echo DETECTED_ANDROID_RUNTIME_CRASH; grep -E -A 30 -B 15 "FATAL EXCEPTION|AndroidRuntime|Process: com\.pureddz\.classic" /tmp/pure-ddz-logcat.txt; exit 1; fi; echo "ANDROID_V120_LAUNCH_SMOKE_OK pid=$PID"'

  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: publish Pure DDZ v1.2.0'))
    needs: [apk, launch-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pure-DDZ-Classic-v1.2.0-ci
          path: dist
      - name: Publish stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Pure DDZ Classic v1.2.0 · 可视化与启力托管版
          target_commitish: main
          make_latest: true
          body: |
            Pure DDZ Classic v1.2.0｜QilyLean 可视化与启力托管版。

            视觉：自己、左家、右家每次出牌均在牌桌中央放大展示；每手牌进入视觉队列，至少保留约 0.9 秒，避免后续电脑出牌瞬间覆盖。
            托管：原“专家 AI 提示”升级为“启力托管”开/关；默认关闭，自主思考优先；开启后自动叫分、选牌、出牌。
            牌面：桌面牌约 120×178px，点数/字体继续放大；牌面上端保留 A/2/3…J/Q/K 与花色，下端统一“启力精益 | https://qilylean.com”。
            横屏：Android 强制 landscape；移动网页/PWA 优先横屏。
            离线：visual-v120.css、visual-v120.js、主题牌面、AI、头像与 C919 素材全部打包进 assets/www，可离线使用。
            验收：仅在 APK 构建校验、Android 35 模拟器安装、MainActivity 启动、5 秒进程存活及 FATAL EXCEPTION 检查全部通过后发布。
            无广告、无登录、无支付。
          files: |
            dist/Pure-DDZ-Classic-v1.2.0.apk
            dist/Pure-DDZ-Classic-v1.2.0.sha256
