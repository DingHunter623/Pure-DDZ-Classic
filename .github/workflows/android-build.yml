name: Build Android APK

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x scripts/build-android-apk.sh
      - run: scripts/build-android-apk.sh
        env:
          PURE_DDZ_SIGNING_DIR: ${{ runner.temp }}/pure-ddz-ci-signing
      - uses: actions/upload-artifact@v4
        with:
          name: Pure-DDZ-Classic-v1.1.0-test-signed
          retention-days: 14
          path: |
            dist/Pure-DDZ-Classic-v1.1.0.apk
            dist/Pure-DDZ-Classic-v1.1.0.sha256
