name: Build Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install stable Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and validate offline APK
        run: |
          chmod +x scripts/build-android-apk.sh
          scripts/build-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pure-DDZ-Classic-v1.0.2-ci
          retention-days: 14
          path: |
            dist/Pure-DDZ-Classic-v1.0.2.apk
            dist/Pure-DDZ-Classic-v1.0.2.sha256
      - name: Publish stable GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Pure DDZ Classic v1.0.2
          target_commitish: main
          make_latest: true
          body: |
            纯净斗地主 v1.0.2 Android 离线修复版。
            修复安装后启动失败风险，恢复 APK 本地 assets/www 游戏资源访问，并加入原生启动兜底页。
            构建阶段强制校验 index.html、style.css、game.js 与 classes.dex 已打包进 APK。
            无广告、无登录、无支付；大字体、中文语音、AI 提示。
            QilyLean｜启力精益 官方发布。
          files: |
            dist/Pure-DDZ-Classic-v1.0.2.apk
            dist/Pure-DDZ-Classic-v1.0.2.sha256

  launch-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pure-DDZ-Classic-v1.0.2-ci
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -r dist/Pure-DDZ-Classic-v1.0.2.apk
            adb logcat -c
            adb shell am force-stop com.pureddz.classic
            adb shell am start -W -n com.pureddz.classic/.MainActivity | tee /tmp/am-start.txt
            grep -q 'Status: ok' /tmp/am-start.txt
            sleep 5
            test -n "$(adb shell pidof com.pureddz.classic | tr -d '\r')"
            adb shell dumpsys activity activities | grep -q 'com.pureddz.classic/.MainActivity'
            if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|AndroidRuntime.*com\.pureddz\.classic'; then
              echo 'Detected Android runtime crash after launch'
              exit 1
            fi
            echo 'ANDROID_LAUNCH_SMOKE_OK'
