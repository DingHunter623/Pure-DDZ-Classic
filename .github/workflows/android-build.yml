name: Build Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install stable Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x scripts/build-android-apk.sh
      - run: scripts/build-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pure-DDZ-Classic-v1.0.0-ci
          path: |
            dist/Pure-DDZ-Classic-v1.0.0.apk
            dist/Pure-DDZ-Classic-v1.0.0.sha256
      - name: Publish stable GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Pure DDZ Classic v1.0.0
          target_commitish: main
          make_latest: true
          body: |
            纯净斗地主 v1.0.0 Android 离线版。
            无广告、无登录、无支付；大字体、中文语音、AI 提示。
            QilyLean｜启力精益 官方发布。
          files: |
            dist/Pure-DDZ-Classic-v1.0.0.apk
            dist/Pure-DDZ-Classic-v1.0.0.sha256
