name: Web Smoke Test

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate v1.2.0 runtime modules
        run: |
          set -euo pipefail
          node --check web/js/qilylean-theme.js
          node --check web/js/card-theme.js
          node --check web/js/visual-v120.js
          node --check web/js/ai-expert.js
          node --check web/js/game.js
          grep -q '"version": "1.2.0"' package.json
          grep -q 'v1.2.0 可视化 · 启力托管版' web/index.html
          grep -q 'css/visual-v120.css' web/index.html
          grep -q 'js/visual-v120.js' web/index.html
          grep -q '启力托管：关' web/index.html
          grep -q '>出牌</button>' web/index.html
          grep -q "VISUAL_HOLD_MS=900" web/js/visual-v120.js
          grep -q 'visualQueue' web/js/visual-v120.js
          grep -q '启力精益 | https://qilylean.com' web/js/card-theme.js
          grep -q "difficulty:'expert'" web/js/game.js
          grep -q "challenge" web/js/ai-expert.js
          grep -q "PublicCardMemory" web/js/ai-expert.js
          grep -q "avatar-king.webp" web/js/card-theme.js
          grep -q "airplane-joker.png" web/js/card-theme.js
          grep -q 'value="expert" selected' web/index.html
          grep -q 'value="challenge"' web/index.html
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          nohup python3 -m http.server 4173 --directory web >/tmp/pure-ddz-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pure-ddz-http.log || true
          exit 1
      - run: npm run test:web
